# Publishes showcase/ (the walkthrough video, the interactive Archify diagrams and the
# screenshots the README uses) to GitHub Pages, so the README can link to pages that play
# and pan instead of static pictures. The app itself deploys to Vercel, not here.
name: Showcase on GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "showcase/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces one still waiting
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    name: Check the showcase files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every diagram has its source, page and preview
        run: |
          set -e
          cd showcase/diagrams
          for source in *.json; do
            name="${source%%.*}"
            test -s "$name.html" || { echo "::error file=showcase/diagrams/$source::$name.html is missing"; exit 1; }
            test -s "$name.png"  || { echo "::error file=showcase/diagrams/$source::$name.png is missing"; exit 1; }
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$source"
            echo "ok  $name"
          done
      - name: Every file the README points into showcase/ exists
        run: |
          set -e
          missing=0
          for path in $(grep -oE 'showcase/[A-Za-z0-9_./-]+' README.md | sort -u); do
            if [ ! -e "$path" ]; then echo "::error file=README.md::$path is missing"; missing=1; fi
          done
          exit $missing

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: showcase
      - id: deployment
        uses: actions/deploy-pages@v4
